[project]
name = "the-document-intelligence-refinery"
version = "0.1.0"
description = "A production-grade, multi-stage agentic pipeline for document intelligence at enterprise scale."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Document extraction
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "docling>=2.0.0",
    # Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    # Vector store
    "faiss-cpu>=1.8.0",
    # Data validation
    "pydantic>=2.7.0",
    # HTTP / API
    "httpx>=0.27.0",
    "openai>=1.30.0",           # OpenRouter is OpenAI-compatible
    # Embedding
    "langchain-openai>=0.2.0",
    # SQLite tooling (stdlib, no extra needed)
    # Utilities
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["I", "N"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
