# Rules and exact thresholds derived from Day 0 analysis on corpus

thresholds:
  triage:
    # If more than 40% are zero-char, likely a scan
    scanned_zero_char_ratio: 0.4

    # Class B first 2 pages are ~0.00012. We raise to 0.0002.
    scanned_density_max: 0.0002

    # Scans are mostly image area, but covers can be sparse
    scanned_image_area_ratio_min: 0.4

    # Class C & D are >0.003
    native_density_min: 0.001

    # Class A is exactly 0.3. We lower to 0.25 to catch it.
    simple_multi_col_ratio_max: 0.25

    # Escalation sensitivity (0.0 to 1.0)
    min_conf_a: 0.85
    min_conf_b: 0.8
    min_conf_c: 0.7 # If below this, flag for human review

    # Strategy B (Layout) thresholds
    min_text_blocks_for_high_conf: 5

    # Resource requirements
    min_chars_per_page: 100
    max_image_area_for_empty_page: 0.5

cost_tiers:
  base_per_page: 0.001
  complexity_multiplier: 1.5
  table_heavy_multiplier: 2.0
  scanned_multiplier: 5.0

vlm:
  # Strategy C budget guard
  max_cost_per_doc_usd: 0.50
  model_name: "google/gemini-2.0-flash-001"
  # Roughly $0.075 per 1M tokens
  token_cost_per_million: 0.075

domain_hints:
  financial:
    - "audit"
    - "financial"
    - "statement"
    - "balance sheet"
    - "profit"
    - "loss"
    - "revenue"
    - "expenditure"
  tax:
    - "tax"
    - "customs"
    - "revenue"
    - "expenditure"
    - "vat"
    - "fta"
  annual_report:
    - "annual report"
    - "performance"
    - "survey"

chunking_rules:
  table_integrity:
    split_from_header: false
    include_metadata: true
  figure_captions:
    store_as_metadata: true
  list_integrity:
    max_tokens_per_item: 512
    keep_as_single_chunk: true
  section_headers:
    propagate_to_children: true
  cross_refs:
    resolve_relationships: true
  max_tokens: 1024
  overlap: 100
